name: Link check

# Weekly *online* link check: the deploy pipeline only checks links
# offline (internal anchors and files), so external link rot would
# otherwise go unnoticed. Failures file (or update) an issue instead of
# failing a deploy.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo

      - name: Build with Hugo
        run: hugo --gc --minify

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Exclusions and accepted statuses: lychee.toml.
          args: --no-progress --root-dir ./public ./public
          output: lychee-report.md
          fail: false

      - name: File or update the link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link check: broken external links"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file lychee-report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file lychee-report.md
          fi
