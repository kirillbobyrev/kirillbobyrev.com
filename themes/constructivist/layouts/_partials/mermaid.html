<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs";

  const blocks = [...document.querySelectorAll("pre.mermaid")];
  const sources = blocks.map((el) => el.textContent.trim());
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const dark = () =>
    (document.documentElement.dataset.theme ||
      (mq.matches ? "dark" : "light")) === "dark";

  // Mermaid's own defaults - layout (ELK), look (neo) and theme - with only
  // the theme's light/dark variant chosen to follow the site. Diagrams are
  // redrawn from the saved sources on every theme change.
  let pass = 0;
  const render = async () => {
    const n = ++pass;
    mermaid.initialize({
      startOnLoad: false,
      theme: dark() ? "redux-dark-color" : "redux-color",
    });
    for (const [i, el] of blocks.entries()) {
      try {
        const { svg } = await mermaid.render(`mermaid-${n}-${i}`, sources[i]);
        if (pass === n) el.innerHTML = svg;
      } catch (e) {
        // Bad diagram source: keep the readable text fallback.
      }
    }
  };

  render();
  mq.addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"],
  });
</script>
