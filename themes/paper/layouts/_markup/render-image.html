{{- /* Markdown images become <figure>s: page resources go through */ -}}
{{- /* responsive-img.html, anything else stays a plain <img>. The image */ -}}
{{- /* title becomes the caption. */ -}}
{{- $alt := .PlainText -}}
{{- $res := "" -}}
{{- if not (urls.Parse .Destination).IsAbs -}}
  {{- $res = .PageInner.Resources.Get .Destination -}}
{{- end -}}
<figure class="figure-block">
  {{- if and $res (eq $res.ResourceType "image") (ne $res.MediaType.SubType "svg") -}}
    {{- partial "responsive-img.html" (dict "image" $res "alt" $alt) -}}
  {{- else -}}
    <img
      src="{{ .Destination | safeURL }}"
      alt="{{ $alt }}"
      loading="lazy"
      decoding="async"
    />
  {{- end -}}
  {{- with .Title -}}
    <figcaption class="figure-caption">{{ . }}</figcaption>
  {{- end -}}
</figure>
