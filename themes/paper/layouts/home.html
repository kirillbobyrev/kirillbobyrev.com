{{- define "main" -}}
  <article class="main-content">
    <header class="page-header">
      <h1 class="page-heading">{{ site.Title }}</h1>
      {{- with .Params.tagline -}}
        <p class="lede">{{ . }}</p>
      {{- end -}}
    </header>
    <div class="prose">{{ .Content }}</div>
    <div class="link-row">
      {{- partial "social-links.html" . -}}
      <a href="/resume.pdf" class="social-link">Resume</a>
    </div>
    <p class="page-footnote">Opinions are my own, never my employer's.</p>
  </article>
{{- end -}}
